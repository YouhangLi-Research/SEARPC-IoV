[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "searpc-iov"
dynamic = ["version"]
description = "Reproducibility artifact for SEARPC secure interaction in consortium-blockchain-enabled Internet of Vehicles"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [{name = "SEARPC Authors"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.3,<2",
  "matplotlib>=3.8,<4",
  "pandas>=2.1,<3",
  "cryptography>=42,<47",
  "Pillow>=10,<13",
]
